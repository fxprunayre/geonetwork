@if (decorator()) {
  @if (icon() && isInspireTheme()) {
    <app-inspire-theme-styles></app-inspire-theme-styles>
    <span [class]="inspireThemeClass()"> </span>
  }
  @if (icon() && !isInspireTheme()) {
    <span [class]="decorator()?.prefix || ''">
      <ng-icon [name]="icon()"></ng-icon>
    </span>
  }
  @if (image()) {
    <div class="w-full h-40 bg-cover" [style.background-image]="'url(' + image() + ')'"></div>
  }
}

@switch (layout()) {
  @case ('checkbox') {
    <div class="flex items-center mb-2">
      <p-checkbox
        [binary]="true"
        [inputId]="keyName() + '_' + bucket().key"
        [ngModel]="isActive()"
        (ngModelChange)="handleChange(bucket().key, $event)"
      ></p-checkbox>
      <label
        class="ml-2 line-clamp-1"
        [for]="keyName() + '_' + bucket().key"
        [pTooltip]="label()"
        tooltipPosition="right"
      >
        <app-aggregation-bucket-decorator [bucket]="bucket()" [decorator]="decorator()" />
        {{ label() }}
      </label>
    </div>
  }
  @case ('button') {
    <p-button
      [pt]="{ host: { class: 'w-full' }, root: { class: 'w-full' } }"
      [title]="label()"
      [variant]="isActive() ? undefined : 'outlined'"
      [severity]="isActive() ? 'primary' : undefined"
      (click)="handleChange(bucket().key, !isActive())"
      [styleClass]="isActive() ? 'active' : ''"
      [attr.aria-pressed]="isActive()"
      size="small"
    >
      <app-aggregation-bucket-decorator
        pButtonIcon
        class="pt-1"
        [bucket]="bucket()"
        [decorator]="decorator()"
      />
      <div class="text-left w-full line-clamp-1">{{ label() }}</div>
    </p-button>
  }
  @case ('card') {
    <p-card
      class="w-full"
      (click)="handleChange(bucket().key, !isActive())"
      [title]="bucket().key | aggregationTranslate: keyName()"
      [pt]="{ header: 'bg-primary text-white', root: 'overflow-hidden' }"
    >
      <ng-template #header>
        <app-aggregation-bucket-decorator
          class="w-full flex justify-center"
          [bucket]="bucket()"
          [decorator]="decorator()"
        />
      </ng-template>
      <div class="font-bold text-2xl w-full">{{ bucket().doc_count }}</div>
      <p class="m-0 line-clamp-1">
        {{ bucket().key | aggregationTranslate: keyName() }}
      </p>
    </p-card>
  }
}

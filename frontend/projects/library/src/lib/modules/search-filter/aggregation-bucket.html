@switch (layout()) {
  @case ('checkbox') {
    <div class="flex items-center mb-2" [pTooltip]="tooltip()">
      <p-checkbox
        [binary]="true"
        [inputId]="keyName() + '_' + bucket().key"
        [ngModel]="isActive()"
        (ngModelChange)="handleChange(bucket().key, $event)"
      ></p-checkbox>
      <label
        class="ml-2 line-clamp-1 break-words break-all"
        [for]="keyName() + '_' + bucket().key"
        tooltipPosition="right"
      >
        <app-aggregation-bucket-decorator [bucket]="bucket()" [decorator]="decorator()" />
        {{ label() }}
      </label>
    </div>
  }
  @case ('button') {
    <p-button
      [pt]="{ host: { class: 'w-full' }, root: { class: 'w-full' } }"
      [title]="tooltip()"
      [variant]="isActive() ? undefined : 'outlined'"
      [severity]="isActive() ? 'primary' : undefined"
      (click)="handleChange(bucket().key, !isActive())"
      [styleClass]="isActive() ? 'active' : ''"
      [attr.aria-pressed]="isActive()"
      size="small"
    >
      <app-aggregation-bucket-decorator
        pButtonIcon
        class="pt-1"
        [bucket]="bucket()"
        [decorator]="decorator()"
      />
      <div class="text-left w-full line-clamp-1">{{ label() }}</div>
    </p-button>
  }
  @case ('card') {
    <p-card
      class="w-full text-left"
      (click)="handleChange(bucket().key, !isActive())"
      [title]="tooltip()"
      [pt]="{
        header: 'bg-primary text-white',
        root: 'overflow-hidden relative aspect-square flex flex-col hover:shadow-xl! transition-shadow duration-300',
        body: 'flex flex-col flex-1 justify-between h-full cursor-pointer',
      }"
      [style]="cardStyle()"
    >
      <ng-template #title>
        @if (isIconDecorator() && !backgroundImage()) {
          <div class="absolute -right-4 -bottom-8 opacity-60 text-[10rem] text-white">
            <app-aggregation-bucket-decorator
              class="block text-[10rem]"
              [bucket]="bucket()"
              [decorator]="decorator()"
            />
          </div>
        }
        <p class="font-bold text-3xl line-clamp-3 relative z-10">
          {{ label() }}
        </p>
        @if (!backgroundImage() && !isIconDecorator()) {
          <app-aggregation-bucket-decorator
            class="w-full flex justify-center"
            [bucket]="bucket()"
            [decorator]="decorator()"
          />
        }
      </ng-template>
      <ng-template #footer>
        <div class="flex flex-row font-bold text-3xl">
          <div class="grow">{{ bucket().doc_count }}</div>
          <ng-icon name="faSolidChevronRight"></ng-icon>
        </div>
      </ng-template>
    </p-card>
  }

        {{ bucket().key | aggregationTranslate: keyName() }}
      </p>
    </p-card>
  } -->
}

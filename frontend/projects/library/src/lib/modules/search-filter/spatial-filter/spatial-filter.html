<div class="m-4">
  @if (showSortRecommendation()) {
    <p-message severity="warn" styleClass="mb-3">
      <span>{{ 'search.spatialFilter.sortRecommendation.message' | translate }}</span>
      <p-button
        [link]="true"
        fluid="true"
        (click)="switchToScoreSort()"
        [label]="'search.spatialFilter.sortRecommendation.action' | translate"
      >
        <ng-icon name="faSolidArrowUpShortWide" pButtonIcon></ng-icon>
      </p-button>
    </p-message>
  }

  <div class="relative">
    <div
      #mapContainer
      class="w-full h-75 bg-slate-100 rounded border border-gray-200 shadow-sm"
    ></div>

    <p-button
      class="absolute top-2 right-2 z-10"
      [pTooltip]="primaryActionTooltip()"
      [outlined]="isDrawing()"
      tooltipPosition="top"
      data-testid="spatial-filter-button"
      (click)="onPrimaryAction()"
    >
      <ng-icon [name]="primaryActionIcon()" pButtonIcon></ng-icon>
    </p-button>
  </div>
</div>

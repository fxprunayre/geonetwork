@switch (panelType()) {
  @case ('none') {
    @for (key of aggregationKeys(); track $index) {
      <div class="flex">
        <app-aggregation-component
          [keyName]="key"
          [buckets]="getBuckets(key)"
          [displayType]="'dropdown'"
        ></app-aggregation-component>
      </div>
    }
  }
  @case ('accordion') {
    <p-accordion [multiple]="true" [value]="activePanels()">
      @for (key of aggregationKeys(); track $index) {
        <p-accordion-panel [value]="key">
          <p-accordion-header>{{ key | translate }}</p-accordion-header>
          <p-accordion-content class="max-h-80 overflow-y-auto overflow-x-hidden">
            <app-aggregation-component
              [keyName]="key"
              [buckets]="getBuckets(key)"
              [displayType]="'checkbox'"
            ></app-aggregation-component>
          </p-accordion-content>
        </p-accordion-panel>
      }
    </p-accordion>
  }
}

@switch (panelType()) {
  @case ('none') {
    @for (key of aggregationKeys(); track $index) {
      @if (hasBuckets(key)) {
        <div class="grid grid-cols-1 gap-4 mb-12">
          <label class="w-full">{{ key | translate }}</label>
          <app-aggregation [keyName]="key"></app-aggregation>
        </div>
      }
    }
  }
  @case ('accordion') {
    <p-accordion [multiple]="true" [value]="activePanels()">
      @for (key of aggregationKeys(); track $index) {
        @if (hasBuckets(key)) {
          <p-accordion-panel [value]="key">
            <p-accordion-header>{{ key | translate }}</p-accordion-header>
            <p-accordion-content class="max-h-80 overflow-y-auto overflow-x-hidden">
              <app-aggregation [keyName]="key"></app-aggregation>
            </p-accordion-content>
          </p-accordion-panel>
        }
      }
    </p-accordion>
  }
}

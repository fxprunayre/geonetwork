@switch (displayType) {
  @case ('checkbox') {
    @for (bucket of buckets; track bucket.key) {
      <div class="flex items-center mb-2">
        <app-aggregation-bucket [keyName]="keyName" [bucket]="bucket" [displayType]="displayType" />
      </div>
    }
  }
  @case ('buttons') {
    @for (bucket of buckets; track bucket.key) {
      <div class="flex items-center mb-2">
        <app-aggregation-bucket [keyName]="keyName" [bucket]="bucket" [displayType]="displayType" />
      </div>
    }
  }
  @case ('dropdown') {
    <p-select
      [options]="buckets"
      [ngModel]="selectedValue"
      (ngModelChange)="onDropdownChange($event)"
      optionLabel="key"
      optionValue="value"
      [placeholder]="'Choose ' + keyName"
    >
      <ng-template let-bucket pTemplate="item">
        <div class="flex align-items-center gap-2">
          <div>{{ bucket.key | aggregationTranslate: keyName }} ({{ bucket.doc_count }})</div>
        </div>
      </ng-template>
    </p-select>
  }
}

<form>
  <div class="relative flex gap-2 px-[20px] md:px-0">
    <p-inputgroup>
      <input
        [placeholder]="'search.input.placeholder' | translate"
        [pAutoFocus]="autofocus()"
        class="border border-gray-400 focus:border-blue-400 rounded-full"
        type="text"
        pInputText
        name="search"
        autocomplete="off"
        [ngModel]="search.searchQuery()"
        (ngModelChange)="searchOnInputChange($event)"
        (keyup.enter)="searchOnClick()"
        (click)="handleInputClick($event)"
        data-testid="search-input"
      />
      <p-inputgroup-addon>
        <p-button
          severity="secondary"
          variant="text"
          (onClick)="searchOnClick()"
          data-testid="search-input-button"
        >
          <ng-icon name="faSolidMagnifyingGlass" pButtonIcon></ng-icon>
        </p-button>
      </p-inputgroup-addon>
    </p-inputgroup>

    @if (popOverTemplate()) {
      <p-popover #op>
        <ng-container *ngTemplateOutlet="popOverTemplate()"></ng-container>
      </p-popover>
    }

    @if (search.searchQuery()) {
      <button
        type="button"
        (click)="clearQuery()"
        class="z-50 absolute right-35 top-1/2 transform -translate-y-1/2 w-[32px] h-[32px] rounded-full bg-primary text-white leading-[35px]"
      >
        <ng-icon name="faSolidXmark" />
      </button>
    }
  </div>
</form>

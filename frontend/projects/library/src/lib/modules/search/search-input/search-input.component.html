<ng-template #searchButton>
  <p-button (click)="searchOnClick()" size="large" styleClass="!p-4 !text-xl">
    <ng-icon name="faSolidMagnifyingGlass" pButtonIcon />
  </p-button>
</ng-template>

<div class="relative flex items-center gap-2 px-[20px] md:px-0">
  @if (autocompleteEnabled()) {
    <p-auto-complete
      [(ngModel)]="queryString"
      [suggestions]="items()"
      optionLabel="title"
      [autofocus]="autofocus()"
      [minQueryLength]="1"
      (completeMethod)="onSearchWithText($event)"
      (onSelect)="onItemSelect($event)"
      (onClear)="clearQuery()"
      [forceSelection]="false"
      [placeholder]="placeholder() || ('search.input.placeholder' | translate)"
      (ngModelChange)="searchOnInputChange($event)"
      (keyup.enter)="searchOnClick()"
      [showClear]="true"
      (click)="handleInputClick($event)"
      [pt]="{ root: 'w-full', pcInputText: { root: 'w-full !p-4 !text-xl' } }"
      data-testid="search-input"
      name="search"
      class="w-full"
    >
      <ng-template let-item pTemplate="item">
        <span>{{ item.title }}</span>
      </ng-template>
      <ng-template pTemplate="clearicon">
        <ng-icon name="faSolidXmark" />
      </ng-template>
    </p-auto-complete>

    <ng-container *ngTemplateOutlet="searchButton" />
  } @else {
    <input
      type="text"
      pInputText
      autocomplete="off"
      [autofocus]="autofocus()"
      [dt]="searchBoxDesign"
      [placeholder]="placeholder() || ('search.input.placeholder' | translate)"
      [ngModel]="queryString"
      (ngModelChange)="searchOnInputChange($event)"
      (keyup.enter)="searchOnClick()"
      [pt]="{ root: 'w-full !p-4 !text-xl' }"
      name="search"
    />

    <ng-container *ngTemplateOutlet="searchButton" />
  }

  @if (popOverTemplate()) {
    <p-popover #op appendTo="body">
      <ng-container *ngTemplateOutlet="popOverTemplate()" />
    </p-popover>
  }
</div>

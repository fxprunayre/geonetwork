@switch (layout()) {
  @case ('checkbox') {
    <div class="flex items-center mb-2">
      <p-checkbox
        [binary]="true"
        [inputId]="keyName() + '_' + bucket().key"
        [ngModel]="isActive"
        (ngModelChange)="handleChange(bucket().key, $event)"
      ></p-checkbox>
      <label class="ml-2" [for]="keyName() + '_' + bucket().key">
        {{ label() }}
      </label>
    </div>
  }
  @case ('button') {
    <div class="flex flex-row gap-2">
      <p-button
        [label]="label()"
        variant="outlined"
        [severity]="isActive() ? 'primary' : undefined"
        (click)="handleChange(bucket().key, !isActive())"
        [styleClass]="isActive() ? 'active' : ''"
        [attr.aria-pressed]="isActive()"
        size="small"
      ></p-button>
    </div>
  }
  @case ('card') {
    <p-card
      class="w-full"
      header="{{ bucket().doc_count }}"
      (click)="handleChange(bucket().key, !isActive())"
      [title]="bucket().key | aggregationTranslate: keyName()"
    >
      <p class="m-0 line-clamp-1">
        {{ bucket().key | aggregationTranslate: keyName() }}
      </p>
    </p-card>
  }
}

@if (hasActiveFilters()) {
  <p>{{ 'activeFilters' | translate }}</p>

  @for (filter of Object.entries(search.filters()); track filter[0]) {
    @for (val of filter[1].values; track String(val)) {
      <p-button
        (onClick)="search.removeFilter(filter[0], val)"
        [label]="(filter[0] | translate) + ': ' + getBucketLabel(filter[0], val)"
        variant="outlined"
        class="me-2"
        severity="secondary"
      ></p-button>
    }
  }
  <p-button (onClick)="search.reset()" class="ms-2" severity="primary">
    <ng-icon name="faSolidXmark"></ng-icon>
    {{ 'resetFilters' | translate }}
  </p-button>
}

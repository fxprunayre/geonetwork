@if (hasActiveFilters()) {
  <div class="border-b-1 border-b-gray-400 pb-2 flex items-center flex-row mb-2 justify-between">
    <div class="flex items-center gap-2">
      <span class="text-sm">{{ 'activeFilters' | translate }}</span>
      <span
        class="bg-primary-500 rounded-full text-white w-[26px] h-[26px] flex items-center justify-center text-xs"
      >
        {{ getActiveFilterCount() }}
      </span>
    </div>
    <p-button (onClick)="search.reset()" severity="primary">
      <ng-icon name="faSolidXmark"></ng-icon>
    </p-button>
  </div>

  @for (filter of Object.entries(search.filters()); track filter[0]) {
    @for (val of filter[1].values; track String(val)) {
      <div
        class="inline-flex items-center bg-gray-200 text-gray-800 rounded-full px-3 py-1 text-sm me-2 mb-2"
      >
        <span class="mr-2">
          {{ (filter[0] | translate) + ': ' + getBucketLabel(filter[0], val) }}
        </span>
        <button
          type="button"
          (click)="search.removeFilter(filter[0], val)"
          class="text-gray-500 hover:text-gray-700 focus:outline-none flex items-center justify-center"
        >
          <ng-icon name="faSolidXmark" class="w-3 h-3"></ng-icon>
        </button>
      </div>
    }
  }
}

@for (value of values(); track $index) {
  @if (decorator(); as clDecorator) {
    @if (clDecorator.type === 'badge') {
      <p-chip
        [label]="value.default | translate"
        [title]="codelist() | translate"
        [ngStyle]="getChipStyle(clDecorator.map[value.key])"
      />
    } @else {
      <p [title]="codelist() | translate">
        {{ value.default | translate }}
      </p>
    }
  } @else {
    <p [title]="codelist() | translate">
      {{ value.default | translate }}
    </p>
  }
}

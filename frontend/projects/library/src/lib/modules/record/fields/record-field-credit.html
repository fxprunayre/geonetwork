@let creds = credits();
@if (creds) {
  <ul>
    @for (c of creds; track $index; let last = $last) {
      @if (!displayFirstOnly() || $index === 0) {
        <ng-template #credit>
          <span class="text-base">
            {{ c['default'] }}
          </span>
        </ng-template>

        <li>
          @if (withSearchLink()) {
            <app-search-link field="resourceCreditObject.default.keyword" [value]="c['default']">
              <ng-container *ngTemplateOutlet="credit"></ng-container>
            </app-search-link>
          } @else {
            <ng-container *ngTemplateOutlet="credit"></ng-container>
          }
        </li>
      }
    }
  </ul>
}

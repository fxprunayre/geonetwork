@if (columns() === 1) {
  <app-keyword-list
    [title]="vocabularies()[0]?.['multilingualTitle']?.['default']"
    [keywords]="keywordColumns()[0]"
  />
} @else {
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <app-keyword-list
      [title]="vocabularies()[0]?.['multilingualTitle']?.['default']"
      [keywords]="keywordColumns()[0]"
    />

    <app-keyword-list
      [title]="vocabularies()[0]?.['multilingualTitle']?.['default']"
      [keywords]="keywordColumns()[1]"
    />
  </div>
}

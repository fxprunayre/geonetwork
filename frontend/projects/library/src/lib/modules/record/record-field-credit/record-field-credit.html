@if (credits()) {
  @for (c of credits(); track $index) {
    @if ((displayFirstOnly() && $index === 0) || !displayFirstOnly()) {
      <span class="text-base text-primary-400" [title]="c['default']">
        @if ($index < credits().length - 1 && !displayFirstOnly()) {
          {{ c['default'] }},
        } @else {
          {{ c['default'] }}
        }
      </span>
    }
  }
}

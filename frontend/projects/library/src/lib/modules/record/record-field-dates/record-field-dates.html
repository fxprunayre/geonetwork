@if (events().length > 0) {
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
    @for (event of events(); track $index) {
      <div class="mb-2">
        <span class="block text-[#3a75ab]">{{ event.label }}</span>
        <app-date-parser [value]="event.date"></app-date-parser>
      </div>
    }
  </div>
}

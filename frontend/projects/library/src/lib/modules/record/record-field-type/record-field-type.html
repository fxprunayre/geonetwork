@if (record().resourceType) {
  <div class="flex flex-row gap-2 items-center text-secondary-500">
    @for (type of selectedResourceType(); track $index) {
      <p-chip class="">
        <ng-icon [name]="getResourceTypeIcon(type)" class="mr-1" />
        <span>{{ type | translate }}</span>
      </p-chip>
    }
    @let spatialType = record()['cl_spatialRepresentationType'];
    @if (withSpatialType() && spatialType) {
      @for (type of spatialType; track $index) {
        <ng-icon name="faSolidChevronRight" />
        <p-chip>
          <ng-icon [name]="getSpatialTypeIcon(type.key)" class="mr-1" />
          <span>{{ type.default }}</span>
        </p-chip>
      }
    }
  </div>
}

@if (record().resourceType) {
  <div class="justify-items-center text-secondary-500">
    @for (type of record().resourceType; track $index) {
      <p-chip class="" [label]="type | translate">
        <!-- TODO icon mode -->
      </p-chip>
    }
    @let spatialType = record()['cl_spatialRepresentationType'];
    @if (withSpatialType() && spatialType) {
      @for (type of spatialType; track $index) {
        <ng-icon name="faSolidChevronRight" />
        <p-chip [label]="type.default">
          <!-- TODO icon mode -->
        </p-chip>
      }
    }
  </div>
}

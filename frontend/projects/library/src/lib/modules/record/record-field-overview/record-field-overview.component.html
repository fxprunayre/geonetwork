@if (overviewList(); as overviews) {
  @if (overviews.length === 0) {
    <div class="w-full h-full flex flex-col items-center justify-center">
      <ng-icon
        name="faImage"
        class="text-6xl text-surface-400"
        [title]="'record.field.overview.notAvailable' | translate"
      ></ng-icon>
    </div>
  } @else if (overviews.length === 1) {
    <ng-container *ngTemplateOutlet="overview; context: { $implicit: overviews[0] }"></ng-container>
  } @else if (overviews.length > 1) {
    <p-galleria
      [value]="overviews"
      [showIndicators]="true"
      indicatorsPosition="top"
      [showThumbnails]="false"
      [containerStyle]="{ 'max-width': '640px' }"
      [numVisible]="5"
    >
      <ng-template #item let-item>
        <ng-container *ngTemplateOutlet="overview; context: { $implicit: item }"></ng-container>
      </ng-template>
    </p-galleria>
  }
}

<ng-template #overview let-overview>
  <p-image
    #image
    [preview]="preview()"
    [imageClass]="'w-full h-full m-w-full object-cover object-center ' + styleClass()"
    [class]="'w-full h-full'"
    [src]="overview.url"
    [title]="overview.nameObject?.default || 'overview'"
    (onImageError)="onImageError($event)"
  ></p-image>
</ng-template>

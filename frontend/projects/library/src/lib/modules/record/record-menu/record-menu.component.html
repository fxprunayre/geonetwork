<div class="flex flex-row gap-2 items-center">
  <p-button
    [title]="'record.action.menu' | translate"
    (click)="menu.toggle($event)"
    size="small"
    severity="secondary"
    #addRecordMenu
  >
    <ng-icon name="faSolidEllipsisVertical" pButtonIcon></ng-icon>
  </p-button>
  <p-tieredmenu #menu [model]="items()" [popup]="true"></p-tieredmenu>
</div>

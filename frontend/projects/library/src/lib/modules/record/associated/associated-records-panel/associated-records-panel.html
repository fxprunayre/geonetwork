<ng-template #defaultHitTemplate let-record>
  <app-result-item-grid [result]="record" (onRecordClick)="handleRecordClick($event)" />
</ng-template>

@for (type of types(); track $index) {
  <div class="has-[>section:empty]:hidden">
    <div class="text-2xl">
      {{ type | translate }}
    </div>

    <section [class]="styleClass()">
      @for (record of relations()[type]; track $index) {
        <ng-container
          *ngTemplateOutlet="resultTemplate() || defaultHitTemplate; context: { $implicit: record }"
        />
      }
    </section>
  </div>
}

<ng-template #defaultHitTemplate let-record>
  <app-result-item-grid [result]="record" (onRecordClick)="handleRecordClick($event)" />
</ng-template>

@for (type of types(); track $index) {
  @if (relations()[type].length > 0) {
    <div class="w-full has-[>section:empty]:hidden">
      <div class="text-2xl">
        {{ 'record.association.' + type | translate: { count: relations()[type].length } }}
      </div>

      <section [class]="styleClass()">
        <p-dataview
          #dv
          [value]="relations()[type]"
          [layout]="'grid'"
          rows="3"
          [paginator]="relations()[type].length > 3"
        >
          <ng-template #grid let-items>
            <div class="grid grid-cols-3 gap-4">
              @for (record of items; track $index) {
                <ng-container
                  *ngTemplateOutlet="
                    resultTemplate() || defaultHitTemplate;
                    context: { $implicit: record }
                  "
                />
              }
            </div>
          </ng-template>
        </p-dataview>
      </section>
    </div>
  }
}

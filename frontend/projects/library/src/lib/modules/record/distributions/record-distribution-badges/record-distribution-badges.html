@if (distributionConfig) {
  @for (section of linksBySectionsSelected() | keyvalue; track $index) {
    <a [routerLink]="'/record/' + record().uuid + '/data-access'">
      <p-badge [value]="section.key" severity="success" class="mx-1" />
    </a>
    @for (link of section.value; track link) {
      @if (link) {}
    }
  }
}

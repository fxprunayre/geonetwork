@if (citationAvailable()) {
  <p-toast></p-toast>
  <h2>{{ 'citation.title' | translate }}</h2>

  <div class="flex gap-2 mb-4">
    @for (f of formats(); track f.id) {
      <button
        (click)="getCitation(f.id)"
        class="p-1 rounded border"
        [class.bg-neutral-600]="currentFormat() === f.id"
        [class.text-white]="currentFormat() === f.id"
      >
        {{ f.label }}
      </button>
    }
  </div>

  <div class="flex gap-3 mb-4">
    <button (click)="copyToClipboard()" class="p-1 bg-neutral-800 text-white rounded">
      {{ 'citation.copy' | translate }}
    </button>

    <a
      [href]="'data:text/plain;charset=utf-8,' + encodeURIComponent(citationText())"
      [download]="getFilename()"
      class="p-1 bg-neutral-200 rounded"
    >
      {{ 'citation.download' | translate }}
    </a>
  </div>

  @if (loading()) {
    <div class="italic text-neutral-500 mb-4">
      {{ 'citation.loading' | translate }}
    </div>
  } @else {
    @if (!isCode()) {
      <div [innerHTML]="citationText()"></div>
    } @else {
      <pre class="bg-neutral-900 text-neutral-200 p-4 rounded">
        {{ citationText() }}
      </pre>
    }
  }
}

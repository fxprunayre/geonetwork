@if (citationAvailable()) {
  <p-toast></p-toast>
  <p-card>
    <ng-template pTemplate="header">
      <div class="flex items-center gap-2 text-gray-800 px-6 pt-6">
        <ng-icon name="faSolidQuoteRight" class="text-lg"></ng-icon>
        {{ 'citation.title' | translate }}
      </div>
    </ng-template>
    <div class="flex gap-2 px-4 items-center">
      <p-selectButton
        [options]="formats()"
        optionLabel="label"
        optionValue="id"
        [ngModel]="currentFormat()"
        (ngModelChange)="onFormatChange($event)"
        class="text-sm font-medium"
      />

      <div class="flex-1"></div>

      <app-copy-input
        [value]="citationText()"
        layout="icon"
        buttonClass="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-100 text-gray-900 hover:bg-white hover:text-gray-400 transition"
      ></app-copy-input>

      <a
        pButton
        class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-100 text-gray-900 hover:bg-white hover:text-gray-400 transition"
        [href]="'data:text/plain;charset=utf-8,' + encodeURIComponent(citationText())"
        [download]="filename()"
      >
        <ng-icon name="faSolidDownload"></ng-icon>
      </a>
    </div>

    <div class="m-4 p-4 bg-gray-100 rounded-lg text-gray-700 leading-relaxed">
      @if (loading()) {
        <div class="italic text-neutral-500 mb-4">
          {{ 'citation.loading' | translate }}
        </div>
      } @else {
        @if (!isCode()) {
          <div [innerHTML]="citationText()"></div>
        } @else {
          <pre class="bg-neutral-900 text-neutral-200 p-4 rounded">{{ citationText() }}</pre>
        }
      }
    </div>
  </p-card>
}

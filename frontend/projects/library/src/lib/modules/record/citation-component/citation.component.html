@if (citationAvailable()) {
  <p-toast></p-toast>
  <p-card>
    <ng-template #title>
      <div class="flex items-center gap-2">
        <ng-icon name="faSolidQuoteRight"></ng-icon>
        {{ 'citation.title' | translate }}
      </div>
    </ng-template>
    <div class="flex gap-2 px-4 items-center">
      <p-selectButton
        [options]="formats()"
        optionLabel="label"
        optionValue="id"
        [ngModel]="currentFormat()"
        (ngModelChange)="onFormatChange($event)"
        class="text-sm font-medium"
      />

      <div class="flex-1"></div>

      <app-copy-input [value]="citationText()" layout="icon"></app-copy-input>

      <a
        pButton
        severity="secondary"
        [href]="'data:text/plain;charset=utf-8,' + encodeURIComponent(citationText())"
        [download]="filename()"
        [title]="'citation.download' | translate"
      >
        <ng-icon name="faSolidDownload"></ng-icon>
      </a>
    </div>

    <p-panel class="m-4 p-4" [pt]="{ header: 'hidden!' }">
      @if (loading()) {
        <p-skeleton class="mb-2" />
        <p-skeleton width="10rem" class="mb-2" />
        <p-skeleton width="5rem" class="mb-2" />
      } @else {
        @if (!isCode()) {
          <div [innerHTML]="citationText()"></div>
        } @else {
          <pre class="bg-neutral-900 text-neutral-200 p-4 rounded">{{ citationText() }}</pre>
        }
      }
    </p-panel>
  </p-card>
}

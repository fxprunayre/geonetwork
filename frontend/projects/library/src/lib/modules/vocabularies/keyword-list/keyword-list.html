@for (group of vocabGroups() | keyvalue; track group.key) {
  <div class="mt-4">
    <div class="font-semibold text-sm text-gray-500">
      {{ group.key }}
    </div>

    <div class="flex flex-wrap mt-2">
      @for (keyword of keywords(); track keyword['_id']) {
        <p-chip
          [label]="keyword.default"
          class="mr-2 my-1 cursor-pointer"
          (click)="openPopover($event, keyword, popover)"
        />
      }
    </div>
  </div>
}

<p-popover #popover>
  <div class="p-3 w-64 text-sm">
    <div class="font-semibold mb-1">
      {{ activeKeyword()?.default }}
    </div>

    @if (activeKeyword()?.uri) {
      <a [href]="activeKeyword()?.uri" target="_blank" class="text-primary break-words">
        {{ activeKeyword()?.uri }}
      </a>
    }

    <div class="my-2">
      @if (loading()) {
        <p-progressSpinner class="w-1 h-1"></p-progressSpinner>
      } @else {
        {{ definition() || 'No definition available' }}
      }
    </div>

    <p-button
      label="Search for this keyword"
      class="mt-3"
      (click)="search(activeKeyword())"
    ></p-button>
  </div>
</p-popover>

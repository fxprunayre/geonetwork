@for (group of vocabGroups() | keyvalue; track group.key) {
  <div class="mt-4">
    <div class="font-semibold text-sm text-gray-500">
      {{ title() }}
    </div>

    <div class="flex flex-wrap mt-2">
      @for (keyword of vocabGroups()[group.key]; track $index) {
        <p-chip
          [label]="keyword.default"
          class="mr-2 my-1 cursor-pointer"
          (mouseenter)="openPopover($event, keyword, popover)"
          (click)="openPopover($event, keyword, popover)"
        />
      }
    </div>
  </div>
}

<p-popover #popover>
  <div class="p-3 text-sm">
    <div class="font-semibold mb-1 flex items-center gap-1 group">
      <ng-icon name="faSolidTag"></ng-icon>

      <span (click)="onKeywordClick(activeKeyword())" class="text-primary cursor-pointer underline">
        {{ activeKeyword()?.default }}
      </span>

      <ng-icon
        name="faSolidMagnifyingGlass"
        class="text-surface-500 inline-flex opacity-0 group-hover:opacity-100 transition-opacity duration-200 cursor-pointer"
      ></ng-icon>
    </div>

    <div class="mt-2">
      @if (loading()) {
        <p-progressSpinner class="w-1 h-1"></p-progressSpinner>
      } @else {
        {{ definition() || 'No definition available' }}
      }
    </div>
  </div>
</p-popover>

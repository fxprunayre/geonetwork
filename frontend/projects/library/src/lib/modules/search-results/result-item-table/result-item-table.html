<p-table [value]="results()" [tableStyle]="" stripedRows>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 10%">{{ 'record.field.resourceType' | translate }}</th>
      <th style="width: 70%">{{ 'record.field.resourceTitle' | translate }}</th>
      <th style="width: 20%">{{ 'record.field.dateStamp' | translate }}</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-result>
    <tr
      (mouseenter)="recordHover.emit(result)"
      (mouseleave)="recordHover.emit(null)"
      (dblclick)="recordDoubleClick.emit(result)"
    >
      <td>
        <app-record-field-type [record]="result" [mainTypeOnly]="true" [layout]="'icon'" />
      </td>
      <td>
        <a
          [routerLink]="navigateOnClick() ? [RECORD_ROUTE_PATH, result.uuid] : null"
          (click)="recordClick.emit(result.uuid)"
          class="font-bold hover:underline cursor-pointer text-primary"
        >
          <app-record-field-title [record]="result" />
        </a>
      </td>
      <td>
        <span class="text-sm" [title]="result.dateStamp | date: 'medium'">
          {{ result.dateStamp | timeAgo }}
        </span>
      </td>
    </tr>
  </ng-template>
</p-table>

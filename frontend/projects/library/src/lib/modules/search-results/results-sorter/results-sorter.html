@if (search().hasResults()) {
  <div class="card flex justify-end">
    <p-select
      [options]="sortOptions()"
      optionValue="value"
      [ngModel]="search().currentSort()"
      (onChange)="onSortChange($event.value)"
      [showClear]="false"
      size="small"
      [placeholder]="'search.sort.placeholder' | translate"
      class="w-full md:w-32"
    >
      <ng-template let-option #item>
        {{ option.label | translate }}
      </ng-template>
      <ng-template let-option #selectedItem>
        {{ option.label | translate }}
      </ng-template>
      <ng-template #dropdownicon>
        <ng-icon name="faSolidArrowUpShortWide" />
      </ng-template>
    </p-select>
  </div>
}

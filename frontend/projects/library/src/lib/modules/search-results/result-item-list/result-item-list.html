@if (result(); as result) {
  @let description = result.resourceAbstractObject?.['default'] || '';
  <ng-template #content>
    <div
      class="w-full md:w-1/4 h-64 md:h-54 relative overflow-hidden rounded-t-(--p-border-radius-md) md:rounded-tr-none md:rounded-l-(--p-border-radius-md) border-b md:border-r border-surface-100"
    >
      <app-record-field-overview
        [field]="result.overview?.[0]"
        [preview]="false"
        styleClass="absolute inset-0 w-full h-full object-cover rounded-t-(--p-border-radius-md) md:rounded-tr-none md:rounded-l-(--p-border-radius-md)"
      />
    </div>

    <div class="flex flex-col p-6 justify-start items-start gap-2 w-full">
      <div class="flex justify-between items-start w-full">
        <app-record-field-type [record]="result" />
        <div>
          <div class="flex gap-3 justify-around">
            <app-record-distribution-badges
              [record]="result"
              [types]="['api', 'download']"
              [layout]="'badge'"
            />
            @if (externalUrl()) {
              <ng-icon name="faSolidArrowUpRightFromSquare" />
            }
          </div>
        </div>
      </div>

      <app-record-field-title
        [record]="result"
        class="text-primary font-bold text-xl line-clamp-2"
      />

      <span class="text-base line-clamp-3 break-all">
        {{ description }}
      </span>

      <app-record-field-credit
        [record]="result"
        class="font-bold uppercase text-primary line-clamp-1"
      />
    </div>
  </ng-template>

  @if (externalUrl()) {
    <a
      [attr.href]="externalUrl()"
      [title]="description"
      target="_blank"
      (click)="handleRecordClick()"
      class="flex flex-col md:flex-row items-stretch gap-0 cursor-pointer rounded-(--p-border-radius-md) border border-surface-100 transition-shadow hover:shadow-md"
    >
      <ng-container *ngTemplateOutlet="content" />
    </a>
  } @else {
    <a
      [routerLink]="[RECORD_ROUTE_PATH, result.info?._id]"
      [title]="description"
      (click)="handleRecordClick()"
      class="flex flex-col md:flex-row items-stretch gap-0 cursor-pointer rounded-(--p-border-radius-md) border border-surface-100 transition-shadow hover:shadow-md"
    >
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }
} @else {
  <div
    class="flex flex-col md:flex-row items-center gap-4 rounded-(--p-border-radius-md) p-6 border border-surface-100"
  >
    <div class="w-full md:w-1/4 h-60 md:h-54">
      <p-skeleton size="10rem" class="" />
    </div>

    <div class="flex flex-col justify-start items-start gap-2 w-full">
      <p-skeleton class="mb-2" />
      <p-skeleton width="10rem" class="mb-2" />
      <p-skeleton width="5rem" class="mb-2" />
    </div>
  </div>
}

@if (types().length > 0) {
  <p-accordion [multiple]="true" [value]="types()">
    @for (type of types(); track $index) {
      <app-associated-records
        [type]="type"
        [relations]="relations()[type]"
        (recordClick)="handleRecordClick($event)"
        [attr.data-testid]="'associated-records-' + type"
      />
    }
  </p-accordion>
}

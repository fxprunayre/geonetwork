<ng-template #defaultHitTemplate let-record>
  <app-result-item-grid [result]="record" (onRecordClick)="handleRecordClick($event)" />
</ng-template>

@if (relations().length > 0) {
  <ng-template #title>
    <div class="text-primary text-2xl font-medium my-4 flex items-center gap-2">
      @let svg = icon();
      @if (svg) {
        <ng-icon [svg]="svg"></ng-icon>
      }
      {{ label() }}
    </div>
  </ng-template>

  <ng-template #content>
    <div class="w-full has-[>section:empty]:hidden">
      @if (!isFullScreen) {
        <ng-container *ngTemplateOutlet="title" />
      }

      <section [class]="styleClass()">
        <p-dataview
          #dv
          [value]="relations()"
          [layout]="'grid'"
          [rows]="isFullScreen ? relations().length : pageSize"
          [paginator]="isFullScreen ? false : relations().length > pageSize"
          [dt]="{ paginator: { bottom: { border: { width: '0' } } } }"
        >
          <ng-template #grid let-items>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
              @for (record of items; track $index) {
                <ng-container
                  *ngTemplateOutlet="
                    resultTemplate() || defaultHitTemplate;
                    context: { $implicit: record }
                  "
                />
              }
            </div>
          </ng-template>
        </p-dataview>
      </section>
    </div>
  </ng-template>

  @if (!isFullScreen) {
    @if (relations().length > pageSize) {
      <p-button
        (click)="isFullScreen = true"
        link
        styleClass="float-right"
        [label]="'relations.seeAll' | translate"
      />
    }
    <ng-container *ngTemplateOutlet="content" />
  } @else {
    <p-drawer [(visible)]="isFullScreen" position="full">
      <ng-template #header>
        <ng-container *ngTemplateOutlet="title" />
      </ng-template>
      <ng-container *ngTemplateOutlet="content" />
    </p-drawer>
  }
}

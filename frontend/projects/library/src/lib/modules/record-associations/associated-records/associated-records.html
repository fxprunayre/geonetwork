<ng-template #defaultHitTemplate let-record>
  <app-result-item-list
    [result]="record"
    [layout]="'compact'"
    (onRecordClick)="handleRecordClick($event)"
  />
</ng-template>

@if (relations().length > 0) {
  <div class="text-primary text-2xl font-medium my-4 flex items-center gap-2">
    @let svg = icon();
    @if (svg) {
      <ng-icon [svg]="svg"></ng-icon>
    }
    {{ label() }}
  </div>

  @let hasPages = relations().length > pageSize;

  <ng-template #resultsGridTemplate let-record>
    <div class="w-full has-[>section:empty]:hidden">
      <section [class]="styleClass()">
        <p-dataview
          #dv
          [value]="relations()"
          [layout]="'grid'"
          [rows]="pageSize"
          [paginator]="relations().length > pageSize"
          [dt]="{ paginator: { bottom: { border: { width: '0' } } } }"
        >
          <ng-template #grid let-items>
            <div class="grid grid-cols-1 gap-4">
              @for (record of items; track $index) {
                <ng-container
                  *ngTemplateOutlet="
                    resultTemplate() || defaultHitTemplate;
                    context: { $implicit: record }
                  "
                />
              }
            </div>
          </ng-template>
        </p-dataview>
      </section>
    </div>
  </ng-template>
  @if (hasPages) {
    <app-full-screen-panel>
      <ng-container *ngTemplateOutlet="resultsGridTemplate"></ng-container>
    </app-full-screen-panel>
  } @else {
    <ng-container *ngTemplateOutlet="resultsGridTemplate"></ng-container>
  }
}

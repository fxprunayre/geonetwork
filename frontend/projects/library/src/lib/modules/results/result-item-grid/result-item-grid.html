<div
  (click)="onViewDetails()"
  class="p-6 border border-surface-200 dark:border-surface-700 cursor-pointer bg-surface-0 dark:bg-surface-900 rounded flex flex-col h-full"
>
  <app-record-field-overview [field]="result().overview?.[0] || []" [preview]="false" />
  <div class="pt-4 flex-1 flex flex-col">
    <div class="flex flex-row justify-between items-start gap-2 mb-4">
      <div class="flex-1">
        <app-record-field-type [record]="result()" />
        <app-record-field-title [record]="result()" class="text-primary text-xl line-clamp-2" />
      </div>
    </div>
    <div class="flex flex-col gap-4 mt-auto">
      @let description = result().resourceAbstractObject?.['default'] || '';
      <span class="text-base line-clamp-3" [title]="description">
        {{ description }}
      </span>
    </div>
  </div>
</div>

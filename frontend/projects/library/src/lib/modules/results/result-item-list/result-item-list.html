<a
  [routerLink]="['/record', result().info?._id]"
  (click)="handleRecordClick()"
  class="flex flex-col lg:flex-row items-center gap-4 cursor-pointer rounded-(--p-border-radius-md) p-[27px] border border-surface-200"
>
  <div
    class="w-full lg:w-[190px] lg:aspect-square lg:flex-shrink-0 lg:overflow-hidden rounded-(--p-border-radius-md)"
  >
    <app-record-field-overview [field]="result().overview?.[0]" [preview]="false" />
  </div>

  <div class="flex flex-col justify-between items-start gap-2 w-full">
    <div class="flex justify-between items-center w-full">
      <app-record-field-type [record]="result()" />
      <div>
        <div class="flex gap-3 justify-around">
          <app-record-distribution-badges
            [record]="result()"
            [types]="['API', 'download']"
            [layout]="'badge'"
          />
        </div>
      </div>
    </div>

    <app-record-field-title [record]="result()" class="text-primary text-xl line-clamp-2" />

    @let description = result().resourceAbstractObject?.['default'] || '';
    <span class="text-base line-clamp-3" [title]="description">
      {{ description }}
    </span>

    <app-record-field-credit [record]="result()" class="line-clamp-1" />
  </div>
</a>

<div #resultsContainer>
  <app-loading-mask [loading]="search.isLoading()" />

  @if (!search.isLoading()) {
    <div class="results-container">
      @if (!search.hasResults()) {
        <app-empty-state></app-empty-state>
      } @else {
        <div class="card">
          @switch (layout()) {
            @case ('list') {
              <div class="results-list grid gap-4">
                @for (result of search.results(); track $index) {
                  <app-result-item-list
                    [result]="result"
                    (onRecordClick)="handleRecordClick($event)"
                  />
                }
              </div>
            }
            @case ('grid') {
              <div
                class="results-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
              >
                @for (result of search.results(); track $index) {
                  <app-result-item-grid
                    [result]="result"
                    (onRecordClick)="handleRecordClick($event)"
                  />
                }
              </div>
            }
          }
          <app-search-results-paginator
            [scope]="scope()"
            [resultsContainerRef]="resultsContainer"
          />
        </div>
      }
    </div>
  }
</div>

<div class="card flex justify-end">
  <p-select
    [options]="sortOptions()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="search.currentSort()"
    (onChange)="onSortChange($event.value)"
    [showClear]="false"
    [placeholder]="'search.sort.placeholder' | translate"
    class="w-full md:w-56"
  />
</div>

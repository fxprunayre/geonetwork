<p-selectButton
  [options]="options()"
  [ngModel]="layout()"
  (ngModelChange)="setLayout($event)"
  [allowEmpty]="false"
>
  <ng-template let-item #item>
    <ng-icon
      [title]="'results.layout.' + item | translate"
      [name]="item === 'list' ? 'faSolidList' : 'faSolidTableCellsLarge'"
    />
  </ng-template>
</p-selectButton>

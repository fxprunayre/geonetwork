@if (safeUrl()) {
  <app-full-screen-panel
    [contentClass]="'h-240 border border-surface-300 rounded-md overflow-hidden'"
    [fullScreenContentClass]="'flex-1 min-h-0 border border-surface-300 rounded-md overflow-hidden'"
  >
    <iframe
      #geolibreIframe
      class="block w-full h-full"
      [src]="safeUrl()"
      title="GeoLibre viewer"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
    ></iframe>
  </app-full-screen-panel>
} @else {
  <p class="text-sm text-surface-600 dark:text-surface-400">Invalid GeoLibre URL.</p>
}

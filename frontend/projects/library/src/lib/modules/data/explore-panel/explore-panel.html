@if (datasources().length > 0) {
  <div class="flex items-center gap-2 px-2">
    <div class="w-1/4 flex items-center gap-2">
      <ng-icon name="faSolidDatabase" />
      {{ 'data.datasource.available' | translate: { count: datasources().length } }}
    </div>
    <app-datasource-select
      class="w-3/4 grow"
      [datasources]="datasources()"
      [(datasource)]="datasource"
    />
  </div>

  @if (datasource()) {
    <app-perspective [datasource]="datasource()" />
  }
}

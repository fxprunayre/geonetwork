@if (datasources().length > 0) {
  <p-fieldset>
    <ng-template #header>
      <div class="flex items-center gap-2 px-2">
        <ng-icon name="faSolidDatabase" />
        {{ 'data.available_datasources' | translate }}
      </div>
    </ng-template>
    <app-datasource-select [datasources]="datasources()" [(datasource)]="datasource" />
  </p-fieldset>

  @if (datasource()) {
    <app-perspective [datasource]="datasource()" />
  }
}

<div
  #contentContainer
  class="content-container relative"
  [ngStyle]="{ 'max-height': calculatedMaxHeight() }"
>
  <ng-content></ng-content>

  @if (!isExpanded() && needsToggle()) {
    <div
      class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-white to-transparent pointer-events-none"
    ></div>

    <div class="absolute bottom-2 right-0 z-10">
      <p-button variant="outlined" size="small" (click)="toggleContent()">
        <ng-icon pButtonIcon [name]="'faSolidChevronDown'" />
        <span pButtonLabel="">{{ 'shared.show-more-toggle.more' | translate }}</span>
      </p-button>
    </div>
  }
</div>

@if (isExpanded() && needsToggle()) {
  <div class="mt-2 mb-2 text-right">
    <p-button variant="outlined" size="small" (click)="toggleContent()">
      <ng-icon pButtonIcon [name]="'faSolidChevronUp'" />
      <span pButtonLabel="">{{ 'shared.show-more-toggle.less' | translate }}</span>
    </p-button>
  </div>
}

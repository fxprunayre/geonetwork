@if (loading()) {
  <div
    class="h-full flex flex-col justify-center items-center relative backdrop"
    data-testid="loading-mask"
  >
    <div class="text-center py-8">
      <p-progress-spinner [ariaLabel]="message() | translate" />
      <p class="mt-4 text-muted-color">{{ message() | translate }}</p>
    </div>
  </div>
}

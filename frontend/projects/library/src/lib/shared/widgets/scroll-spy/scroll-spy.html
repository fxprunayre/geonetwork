<ng-template #navigation>
  <div [class]="isTopNav() ? 'flex items-center justify-center space-x-4' : 'space-y-2'">
    @for (section of sections; track section.id) {
      <a
        [class]="sectionClass(section.id)"
        [attr.aria-selected]="isSectionActive(section.id) ? 'true' : null"
        tabindex="0"
        (click)="scrollTo(section.id)"
        (keydown.enter)="scrollTo(section.id)"
        (keydown.space)="scrollTo(section.id); $event.preventDefault()"
      >
        {{ section.title }}
      </a>
    }
  </div>
</ng-template>

<div [class]="isAsideNav() ? 'flex' : ''">
  @if (isTopNav()) {
    <nav class="sticky top-0 z-10 bg-white/95 w-full p-2">
      <ng-container *ngTemplateOutlet="navigation" />
    </nav>
  }
  <main>
    <ng-content />
  </main>
  @if (isAsideNav()) {
    <aside class="hidden md:inline w-60 p-4 sticky top-4 h-full">
      <ng-container *ngTemplateOutlet="navigation" />
    </aside>
  }
</div>

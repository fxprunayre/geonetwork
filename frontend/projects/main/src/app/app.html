<main class="flex flex-row">
  <app-menu class="sticky top-0 h-screen self-start z-40 print:hidden" />
  <!-- <app-menu class="absolute top-0 m-2 self-start print:hidden"/> -->

  <section
    class="grow"
    appSearchContext="main"
    [aggregations]="searchConfig().aggregations"
    [filter]="searchConfig().filter"
    [routing]="true"
    [size]="searchPageSize()"
    [filter]="[{ query_string: { query: '+isTemplate:n' } }]"
    [sort]="searchConfig().sort"
    [currentSort]="searchConfig().currentSort"
    [layoutOptions]="searchConfig().resultsLayoutOptions"
    [language]="searchLanguage()"
  >
    <app-map [class.hidden]="!isMapActive()" class="h-full w-full block"></app-map>
    <app-search [class.hidden]="!isSearchActive()" class="h-full w-full block"></app-search>
    <router-outlet></router-outlet>
    <p-scroll-top target="window" class="print:hidden" />
  </section>
</main>
<p-toast />

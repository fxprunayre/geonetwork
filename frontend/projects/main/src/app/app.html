<main class="flex flex-row min-h-screen">
  <app-navigation
    class="sticky top-0 h-screen shrink-0 overflow-y-auto transition-all duration-300"
  />

  <section
    class="flex-grow h-screen overflow-y-auto"
    appSearchContext="main"
    [aggregations]="searchConfig.aggregations"
    [filter]="searchConfig.filter"
    [routing]="true"
    [size]="searchPageSize"
    [filter]="[{ query_string: { query: '+isTemplate:n' } }]"
    [sort]="searchConfig.sort"
    [currentSort]="searchConfig.currentSort"
  >
    <router-outlet></router-outlet>
    <p-scroll-top target="parent" />
  </section>
</main>

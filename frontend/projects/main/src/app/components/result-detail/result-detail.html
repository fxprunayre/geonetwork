<div class="container mx-auto p-4" #recordDetails>
  <app-record-view
    [uuid]="uuid()"
    [tab]="tab()"
    [backButtonTplRef]="backButton"
    (onRecordClick)="handleRecordClick($event)"
  >
    <ng-template #backButton>
      <button pButton (click)="goBack()" [outlined]="true" class="mb-4">
        <ng-icon name="faSolidArrowLeft" pButtonIcon></ng-icon>
        <span pButtonLabel>{{ 'backToResults' | translate }}</span>
      </button>
    </ng-template>
  </app-record-view>
</div>

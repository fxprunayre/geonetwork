<nav class="h-full" (mouseenter)="expandMenu()" (mouseleave)="collapseMenu()">
  <p-menu
    [model]="items()"
    class="h-full"
    [pt]="{
      root: '!min-w-fit h-full transition-all duration-500 ease-in-out',
      itemContent: 'text-2xl',
      itemLabel: {
        class: {
          'overflow-hidden': true,
          'whitespace-nowrap': true,
          'transition-all': true,
          'duration-500': true,
          'ease-in-out': true,
          'max-w-0': isIconMode(),
          'opacity-0': isIconMode(),
          'ml-0': isIconMode(),
          'max-w-40': !isIconMode(),
          'opacity-100': !isIconMode(),
          'ml-2': !isIconMode(),
        },
      },
    }"
    [dt]="dt"
  >
    <ng-template #start>
      <div class="p-menu-list flex flex-row!">
        <a class="p-menu-item-link" role="menuitem" (click)="toggleMenu()">
          <ng-icon
            [name]="isIconMode() ? 'faSolidBars' : 'faSolidEllipsisVertical'"
            class="md:text-2xl"
          ></ng-icon>
        </a>
        <a routerLink="/" [class.hidden]="isIconMode()">
          <img [src]="logo" alt="Logo" class="h-[26px] md:h-[36px]" />
        </a>
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <div class="h-full flex flex-col gap-6 grow p-4"></div>
    </ng-template>
  </p-menu>

  <p-drawer [(visible)]="isConfigurationVisible" header="Configure" position="right">
    <p-fieldset legend="Language">
      <app-language-switcher />
    </p-fieldset>

    <p-fieldset legend="Theme">
      <app-theme-designer [theme]="theme" />
    </p-fieldset>
    <p-fieldset legend="Config">
      <p-iftalabel>
        <textarea
          pTextarea
          id="description"
          [ngModel]="appConfigJson()"
          (ngModelChange)="updateConfig($event)"
          rows="10"
          style="resize: none"
        ></textarea>
        <label for="description">Configuration</label>
      </p-iftalabel>
    </p-fieldset>
  </p-drawer>
</nav>

<p-toast />

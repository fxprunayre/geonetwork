<nav class="h-full" (mouseenter)="expandMenu()" (mouseleave)="collapseMenu()">
  <p-menu
    [model]="items()"
    class="h-full"
    [pt]="{
      root: '!min-w-fit h-full transition-all duration-300 ease-in-out',
      itemContent: 'text-2xl',
      itemLabel: {
        class: {
          'overflow-hidden': true,
          'whitespace-nowrap': true,
          'transition-all': true,
          'duration-300': true,
          'ease-in-out': true,
          'max-w-0': isIconMode(),
          'opacity-0': isIconMode(),
          'ml-0': isIconMode(),
          'max-w-40': !isIconMode(),
          'opacity-100': !isIconMode(),
          'ml-2': !isIconMode(),
        },
      },
    }"
    [dt]="dt"
  >
    <ng-template #start>
      <div class="p-menu-list flex flex-row! header-row">
        <a class="p-menu-item-link" role="menuitem" (click)="toggleMenu()">
          <ng-icon
            [name]="isIconMode() ? 'faSolidBars' : 'faSolidEllipsisVertical'"
            class="md:text-2xl"
          ></ng-icon>
        </a>
        <app-catalogue-logo
          [class.hidden]="isIconMode()"
          class="transition-all"
        ></app-catalogue-logo>
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <ul class="p-menu-list">
        <li
          class="p-menu-item-link"
          role="menuitem"
          routerLinkActive="p-menu-item-link-active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <a [routerLink]="[DASHBOARD_ROUTE_PATH]" class="flex flex-row gap-4">
            <app-user-avatar />

            <span
              class="transition-all flex flex-col items-start w-full"
              [class.hidden]="isIconMode()"
            >
              <span class="font-bold wrap-break-word"> {{ user() | userFullName }}</span>
              <span class="text-sm">{{ userRole() }}</span>
            </span>
          </a>
        </li>
      </ul>
    </ng-template>
  </p-menu>

  <app-record-add-button />

  <p-drawer
    [(visible)]="isConfigurationVisible"
    [header]="'menu.settings' | translate"
    position="right"
    [pt]="{ header: 'header-row' }"
  >
    <p-fieldset legend="Language">
      <app-language-switcher />
    </p-fieldset>

    <p-fieldset legend="Theme">
      <app-theme-designer [theme]="theme" />
    </p-fieldset>

    <p-fieldset legend="Config">
      <p-iftalabel>
        <textarea
          pTextarea
          id="description"
          [ngModel]="appConfigJson()"
          (ngModelChange)="updateConfig($event)"
          rows="10"
          style="resize: none"
        ></textarea>
        <label for="description">Configuration</label>
      </p-iftalabel>
    </p-fieldset>
  </p-drawer>
</nav>

<p-toast />

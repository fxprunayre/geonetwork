<app-record-view
  [uuid]="uuid()"
  [tab]="tab()"
  [backButtonTplRef]="backButton"
  (onRecordClick)="handleRecordClick($event)"
>
  <ng-template #backButton>
    <p-button (click)="goBack()" [title]="'search.backToResults' | translate">
      <ng-icon name="faSolidXmark" pButtonIcon></ng-icon>
    </p-button>
  </ng-template>
</app-record-view>

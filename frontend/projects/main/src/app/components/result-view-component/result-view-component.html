<!-- Loading State -->
@if (store.isLoading()) {
  <app-loading-component></app-loading-component>
}

<!-- Results Container -->
@if (!store.isLoading()) {
  <div class="results-container">
    <!-- No Results State -->
    @if (!store.hasResults()) {
      <app-empty-state></app-empty-state>
    }
    <!-- Results Display -->
    @if (store.hasResults()) {
      <div class="card">
        <!-- Results Header -->
        <app-result-header
          [totalCount]="store.totalCount()"
          [currentCount]="results.length"
          [layout]="layout"
          (layoutChange)="onLayoutChange($event)"
        >
        </app-result-header>
        <!-- List View -->
        @if (layout === 'list') {
          <div class="results-list">
            @for (result of results; track $index; let first = $first) {
              <app-result-item-list
                [result]="result"
                [isFirst]="first"
                (viewDetails)="viewDetails($event)"
              >
              </app-result-item-list>
            }
          </div>
        }
        <!-- Grid View -->
        @if (layout === 'grid') {
          <div
            class="results-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
          >
            @for (result of results; track $index) {
              <app-result-item-grid [result]="result" (viewDetails)="viewDetails($event)">
              </app-result-item-grid>
            }
          </div>
        }
        <app-search-results-paginator />
      </div>
    }
  </div>
}

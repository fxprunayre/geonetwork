<p-card [dt]="{ colorScheme: { light: { root: { background: 'var(--p-surface-50)' } } } }">
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-3">
      <app-results-number class="grow font-semibold text-primary me-4 text-base" />
      <app-results-sorter />
      @if (layoutOptions.length > 1) {
        <app-result-layout-switcher [options]="layoutOptions" [(layout)]="layout" />
      }
    </div>

    @if (filterPosition === 'top') {
      <div>
        <app-search-filters />
      </div>
    }

    <div>
      @if (topTabFilter) {
        <app-aggregation
          [keyName]="topTabFilter"
          [displayType]="'button'"
          class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2"
        ></app-aggregation>
      }
    </div>
  </div>
</p-card>

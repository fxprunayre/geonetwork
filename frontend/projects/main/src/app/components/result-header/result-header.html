@if (topTabFilter) {
  <div class="flex items-center mb-4 bg-[#F2F5F9] py-[23px] px-[17px] rounded">
    <div class="flex items-center gap-3 flex-start flex-wrap">
      <span class="font-semibold text-primary me-4 text-base">
        <app-result-number></app-result-number>
      </span>

      @if (topTabFilter) {
        <app-aggregation
          [keyName]="topTabFilter"
          [displayType]="'button'"
          class="flex items-start gap-2"
        ></app-aggregation>
      }
    </div>
  </div>
}

@if (topTabFilter) {
  <div class="flex items-center mb-4 bg-[#F2F5F9] py-[23px] px-[17px] rounded">
    <div class="flex items-center gap-3 flex-start flex-wrap">
      <span class="font-semibold text-primary me-4 text-base">{{ totalCount }} results:</span>

      @if (getFilterData) {
        @for (bucket of getFilterData.buckets; track bucket.key) {
          <app-aggregation-component
            [keyName]="getFilterData.key"
            [bucket]="bucket"
            [displayType]="'buttons'"
            (tabSelected)="onTabSelected($event)"
          ></app-aggregation-component>
        }
      }
    </div>
  </div>
}

<section>
  <div
    class="py-4 px-[20px] xl:px-[400px] flex flex-col gap-4 bg-top-left bg-no-repeat bg-blend-overlay z-30 bg-primary/80 sticky top-0 bg-cover bg-image"
  >
    <div class="flex flex-row items-center gap-4">
      <app-search-input class="w-full" [autocompleteEnabled]="true" />

      @if (filterPanelMode() == 'drawer') {
        <p-button
          size="large"
          (click)="visible = !visible"
          [badge]="search.activeFilterCount() === 0 ? undefined : search.activeFilterCount() + ''"
        >
          <ng-icon name="faSolidFilter" pButtonIcon></ng-icon>
          <div pButtonLabel>
            {{ 'search.filter.panel.open' | translate }}
          </div>
        </p-button>
      }
    </div>
  </div>
  <hr />

  <div class="flex flex-col md:flex-row min-h-screen gap-6 p-4">
    @switch (filterPanelMode()) {
      @case ('side') {
        <div class="w-full xl:w-1/3">
          <app-side-panel />
        </div>
      }
      @case ('drawer') {
        <p-drawer [(visible)]="visible" header="Filter" [modal]="false">
          <app-side-panel />
        </p-drawer>
      }
    }

    <div class="w-full" [class.xl:px-[300px]]="filterPanelMode() === 'drawer'">
      <app-result-header />
      <div class="flex flex-row justify-end items-center gap-2 my-4">
        <p-select [options]="['drawer', 'side']" [(ngModel)]="filterPanelMode" />
        @if (this.hasResults) {
          <app-sort-results />
        }
      </div>
      <app-result-view (onRecordClick)="handleRecordClick($event)" />
    </div>
  </div>
</section>

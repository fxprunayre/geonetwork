<div class="flex flex-row">
  <div class="grow w-full">
    <div
      class="py-4 px-5 flex flex-col gap-4 bg-top-left bg-no-repeat bg-blend-overlay z-30 bg-primary/80 sticky top-0 bg-cover bg-image"
    >
      <div class="flex flex-col lg:flex-row items-center lg:gap-4">
        <app-search-input
          class="w-full grow"
          [autocompleteEnabled]="true"
          [placeholder]="search | searchWelcomeTextPipe: 'resourceType' : 3"
        />

        @if (filterPanelMode() == 'drawer' || filterPanelMode() == 'side') {
          <app-search-active-filters-button [(visible)]="visible" />
        }
      </div>
    </div>

    <div class="mx-auto max-w-7xl w-full px-6 py-6 flex flex-col md:flex-row min-h-screen gap-6">
      <div class="w-full" [class.xl:px-[200px]]="filterPanelMode() === 'drawer'">
        @if (search.layout()) {
          <div class="mb-6">
            <app-result-header
              [layout]="search.layout()"
              (layoutChange)="search.setLayout($event)"
              [layoutOptions]="resultsLayoutOptions()"
            />
          </div>
          <app-result-view [layout]="search.layout()" />
        }
      </div>
    </div>
  </div>

  @switch (filterPanelMode()) {
    @case ('drawer') {
      <p-drawer
        [(visible)]="visible"
        [header]="'search.filter.title' | translate"
        [modal]="false"
        position="right"
      >
        <app-side-panel />
      </p-drawer>
    }
    @case ('side') {
      <div
        class="w-full h-screen sticky top-0 self-start transition-all duration-500 ease-in-out overflow-hidden min-w-0 max-w-[400px] border-l-2 border-primary-200"
        [ngClass]="visible ? 'sm:w-1/3 sm:opacity-100' : 'sm:w-0 sm:opacity-0'"
      >
        <div class="flex flex-row p-4 items-center text-primary border-b-2 border-primary-200">
          <div class="grow text-xl font-bold">
            <ng-icon name="faSolidFilter"></ng-icon>
            {{ 'search.filter.title' | translate }}
          </div>
          <div>
            <p-button
              class="mb-4"
              (click)="visible = !visible"
              size="small"
              variant="text"
              rounded="true"
            >
              <ng-icon name="faSolidXmark" pButtonIcon></ng-icon>
            </p-button>
          </div>
        </div>
        <app-side-panel />
      </div>
    }
  }
</div>

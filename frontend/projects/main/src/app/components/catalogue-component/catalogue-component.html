<div
  class="bg-top-left bg-no-repeat bg-blend-overlay z-30 bg-primary/40 sticky top-0 bg-cover bg-image"
>
  <div
    class="mx-auto max-w-7xl w-full px-6 py-4 md:py-8 flex flex-col md:flex-row gap-4 items-center"
  >
    <app-search-input
      class="w-full grow"
      [autocompleteEnabled]="true"
      [placeholder]="search | searchWelcomeTextPipe: 'resourceType' : 3"
    />

    @if (filterPanelMode() == 'drawer') {
      <div>
        <p-inputgroup>
          <p-inputgroup-addon>
            <p-button size="large" (click)="visible = !visible">
              <ng-icon name="faSolidFilter" pButtonIcon></ng-icon>
              <div pButtonLabel>
                {{ 'search.filter.panel.open' | translate }}
              </div>
            </p-button>
          </p-inputgroup-addon>
          <p-inputgroup-addon>
            <p-button
              size="large"
              (click)="search.reset()"
              [badge]="
                search.activeFilterCount() === 0 ? undefined : search.activeFilterCount() + ''
              "
            >
              <ng-icon name="faSolidXmark" pButtonIcon></ng-icon>
              <div pButtonLabel>&nbsp;</div>
            </p-button>
          </p-inputgroup-addon>
        </p-inputgroup>
      </div>
    }
  </div>
</div>

<div class="mx-auto max-w-7xl w-full px-6 py-12 flex flex-col md:flex-row min-h-screen gap-6">
  @switch (filterPanelMode()) {
    @case ('side') {
      <div class="w-full xl:w-1/3">
        <app-side-panel />
      </div>
    }
    @case ('drawer') {
      <p-drawer
        [(visible)]="visible"
        [header]="'search.filter.title' | translate"
        [modal]="false"
        position="right"
      >
        <app-side-panel />
      </p-drawer>
    }
  }

  <div class="w-full" [class.xl:px-[200px]]="filterPanelMode() === 'drawer'">
    <app-result-header />
    <div class="flex flex-row justify-end items-center gap-2 my-4">
      <!--        <p-select [options]="['drawer', 'side']" [(ngModel)]="filterPanelMode"/>-->
    </div>
    <app-result-view (onRecordClick)="handleRecordClick($event)" />
  </div>
</div>

<div
  class="py-4 px-[20px] xl:px-[200px] flex flex-col gap-4 bg-top-left bg-no-repeat bg-blend-overlay z-30 bg-primary/80 sticky top-0 bg-cover bg-image"
>
  <div class="flex flex-col lg:flex-row items-center lg:gap-4">
    <app-search-input
      class="w-full grow"
      [autocompleteEnabled]="true"
      [placeholder]="search | searchWelcomeTextPipe: 'resourceType' : 3"
    />

    @if (filterPanelMode() == 'drawer') {
      <div>
        <p-inputgroup class="mt-6 lg:mt-0">
          <p-inputgroup-addon>
            <p-button size="large" (click)="visible = !visible">
              <ng-icon name="faSolidFilter" pButtonIcon></ng-icon>
              <div pButtonLabel>
                {{ 'search.filter.panel.open' | translate }}
              </div>
            </p-button>
          </p-inputgroup-addon>
          @if (search.activeFilterCount() > 0) {
            <p-inputgroup-addon>
              <p-button
                size="large"
                (click)="search.reset()"
                [badge]="
                  search.activeFilterCount() === 0 ? undefined : search.activeFilterCount() + ''
                "
              >
                <ng-icon name="faSolidXmark" pButtonIcon></ng-icon>
                <div pButtonLabel>&nbsp;</div>
              </p-button>
            </p-inputgroup-addon>
          }
        </p-inputgroup>
      </div>
    }
  </div>
</div>

<div class="mx-auto max-w-7xl w-full px-6 py-6 flex flex-col md:flex-row min-h-screen gap-6">
  @switch (filterPanelMode()) {
    @case ('side') {
      <div class="w-full xl:w-1/3">
        <app-side-panel />
      </div>
    }
    @case ('drawer') {
      <p-drawer
        [(visible)]="visible"
        [header]="'search.filter.title' | translate"
        [modal]="false"
        position="right"
      >
        <app-side-panel />
      </p-drawer>
    }
  }

  <div class="w-full" [class.xl:px-[200px]]="filterPanelMode() === 'drawer'">
    <div class="mb-6">
      <app-result-header />
    </div>
    <app-result-view />
  </div>
</div>

<section>
  <div
    class="py-4 px-[20px] xl:px-[400px] flex flex-row gap-4 bg-top-left bg-auto bg-blend-overlay z-30 bg-primary/80 sticky top-0"
    [style.background-image]="'url(' + bgFirst + ')'"
  >
    <app-search-input class="w-full"></app-search-input>

    @if (filterPanelMode() == 'drawer') {
      <p-button (click)="visible = !visible">
        <ng-icon name="faSolidFilter" pButtonIcon></ng-icon>
        <span pButtonLabel>Filter</span>
      </p-button>
    }
  </div>
  <hr />

  <div class="flex flex-col md:flex-row min-h-screen gap-6 p-4">
    @switch (filterPanelMode()) {
      @case ('side') {
        <div class="w-full xl:w-1/3">
          <app-side-panel />
        </div>
      }
      @case ('drawer') {
        <p-drawer [(visible)]="visible" header="Filter" [modal]="false">
          <app-side-panel />
        </p-drawer>
      }
    }
    <div class="w-full" [class.xl:px-[300px]]="filterPanelMode() === 'drawer'">
      <app-result-header />
      <div class="flex flex-row justify-end items-center gap-2">
        <p-select [options]="['drawer', 'side']" [(ngModel)]="filterPanelMode" />
        <app-sort-results />
      </div>
      <app-result-view />
    </div>
  </div>
</section>

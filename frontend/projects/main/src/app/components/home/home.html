<section
  appSearchContext="home"
  [aggregations]="homeAggregationConfig()"
  [filter]="[{ query_string: { query: '+isTemplate:n' } }]"
  [language]="language()"
>
  <app-page-layout>
    <ng-template #header>
      <section class="transition-all duration-300">
        @if (bannerTitle()) {
          <div class="flex flex-row">
            <h1
              class="text-4xl sm:text-5xl md:text-6xl font-extrabold leading-tight max-w-2xl mx-auto md:mx-0"
            >
              {{ bannerTitle() | translate }}
            </h1>
          </div>
        }

        @if (bannerSubTitle()) {
          <p class="text-lg sm:text-xl md:text-2xl mt-4 mb-8 max-w-xl mx-auto md:mx-0">
            {{ bannerSubTitle() | translate }}
          </p>
        }
      </section>
    </ng-template>
    <app-home-highlights class="grow" [scope]="'home'"></app-home-highlights>
  </app-page-layout>
</section>

<section class="relative flex flex-col justify-center items-center py-12 overflow-hidden">
  <div class="flex flex-col justify-center max-w-7xl w-full px-6 mt-16 text-center">
    <h2 class="text-4xl sm:text-5xl md:text-6xl text-primary font-extrabold mb-10">
      {{ 'home.discover' | translate }}
    </h2>
  </div>
</section>

@for (aggregation of aggregations(); track $index) {
  @if (search.hasAggregationBuckets(aggregation)) {
    @let layout = search.aggregations()[aggregation].meta?.layout || 'card';
    <section
      class="flex flex-col justify-center items-center py-12 overflow-hidden odd:bg-surface-50 shadow-md"
    >
      <div class="max-w-7xl w-full px-6 text-center">
        <h3 class="text-2xl sm:text-3xl md:text-4xl text-primary font-bold mb-10">
          {{ 'search.aggregations.' + aggregation | translate }}
        </h3>
        <app-aggregation
          scope="home"
          [keyName]="aggregation"
          [displayType]="layout"
          [class.sm:grid-cols-3]="layout === 'card'"
          [class.md:grid-cols-4]="layout === 'card'"
          class="my-12 grid grid-cols-1 gap-6"
          (onSelected)="setRouteForAggregation($event)"
        ></app-aggregation>
      </div>
    </section>
  }
}

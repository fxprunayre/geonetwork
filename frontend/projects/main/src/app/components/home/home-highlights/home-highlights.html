<section
  class="relative flex flex-col justify-center items-center py-12 overflow-hidden bg-center bg-cover bg-blend-overlay bg-white/80 bg-image"
>
  <div class="flex flex-col justify-center max-w-7xl w-full px-6 mt-16 text-center">
    <h2 class="text-4xl sm:text-5xl md:text-6xl text-primary font-extrabold mb-10">
      {{ 'home.discover' | translate }}
    </h2>

    @for (aggregation of aggregations(); track $index) {
      @if (search.hasAggregationBuckets(aggregation)) {
        <h3 class="text-2xl sm:text-3xl md:text-4xl text-primary font-bold mb-10">
          {{ 'search.aggregations.' + aggregation | translate }}
        </h3>
        <app-aggregation
          scope="home"
          [keyName]="aggregation"
          displayType="card"
          class="my-12 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
          (onSelected)="setRouteForAggregation($event)"
        ></app-aggregation>
      }
    }
  </div>
</section>

image: node:22-trixie-slim

stages:
  - build
  - pages

variables:
  MAVEN_OPTS: "-Dmaven.test.skip=true"

cache:
  paths:
    - .m2/repository
    - frontend/node_modules/

build_gn5:
  stage: build
  script:
    # 1. Build Maven complet (génère les libs Angular)
    - mvn -DskipTests clean install

    # 2. Installer Angular CLI
    - npm install -g @angular/cli

    # 3. Installer Angular CLI
    - npm install -g @angular/cli

    # 4. Build Angular main
    - cd frontend
    - npm install
    - ng build main --configuration=sextant --base-href "/geonetwork5/"

    # 5. Déplacer le build Angular dans public/ pour GitLab Pages
    - mkdir -p ../public
    - cp -r dist/main/browser/* ../public/

  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  stage: pages
  script:
    - echo "Publishing GitLab Pages"
  artifacts:
    paths:
      - public
  only:
    - main
